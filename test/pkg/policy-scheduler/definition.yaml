apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xpolicyscheduler.example.com
spec:
  group: policyscheduler.example.com
  names:
    kind: XPolicyScheduler
    plural: xpolicyschedulers
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                schedules:
                  type: array
                  items:
                    type: object
                    properties:
                      roleName:
                        type: string
                      policyArn:
                        type: string
                      scheduleFrom:
                        type: string
                        format: date-time
                      scheduleUntil:
                        type: string
                        format: date-time
