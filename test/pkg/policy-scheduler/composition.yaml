apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xpolicyscheduler.aws.example.com
spec:
  compositeTypeRef:
    apiVersion: policyscheduler.example.com/v1alpha1
    kind: XPolicyScheduler
  mode: Pipeline
  pipeline:
  - step: environmentConfigs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Reference
          ref:
            name: envconfig
  - functionRef:
      name: function-go-templating
    step: generate-scheduled-resources
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |-
          {{/*
            This composition iterates through all schedules defined in the XPolicyScheduler.
            Due to persistent limitations of the 'function-go-templating' in handling
            date comparisons, this version will provision an AWS IAM Role and an
            AWS IAM RolePolicyAttachment for *every* schedule, regardless of the
            'scheduleFrom' and 'scheduleUntil' times.
            The time-based conditional provisioning cannot be implemented with the current
            Go template function.
            Restructured the template to use two separate loops: one for all Roles,
            and another for all RolePolicyAttachments.
            Explicitly added newline before each '---' using 'print "\n---"' to
            ensure robust multi-document YAML parsing and resolve missing resources.
          */}}
          {{- range $i, $schedule := .observed.composite.resource.spec.schedules -}}
          {{- print "\n---" }}
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: Role
          metadata:
            name: {{ $schedule.roleName }}
            labels:
              crossplane.io/composite: {{ .observed.composite.resource.metadata.name }}
              schedule-index: "{{ $i }}"
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $schedule.roleName }}
          spec:
            forProvider:
              assumeRolePolicy: |
                {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": {
                        "Service": "ec2.amazonaws.com"
                      },
                      "Action": "sts:AssumeRole"
                    }
                  ]
                }
              description: "Managed by Crossplane for scheduled policy attachment"
            providerConfigRef:
              name: default # Assuming 'default' AWS provider config exists
          {{- end -}}
          {{- range $i, $schedule := .observed.composite.resource.spec.schedules -}}
          {{- print "\n---" }}
          apiVersion: iam.aws.upbound.io/v1beta1
          kind: RolePolicyAttachment
          metadata:
            name: {{ $schedule.roleName }}-{{ $i }}-policy-attachment # Unique name for attachment
            labels:
              crossplane.io/composite: {{ .observed.composite.resource.metadata.name }}
              schedule-index: "{{ $i }}"
            annotations:
              gotemplating.fn.crossplane.io/composition-resource-name: {{ $schedule.roleName }}-{{ $i }}-policy-attachment
          spec:
            forProvider:
              role: {{ $schedule.roleName }}
              policyArn: {{ $schedule.policyArn }}
            providerConfigRef:
              name: default # Assuming 'default' AWS provider config exists
            dependsOn:
              - of:
                  apiVersion: iam.aws.upbound.io/v1beta1
                  kind: Role
                name: {{ $schedule.roleName }}
          {{- end -}}

  - step: automatically-detect-ready-composed-resources
    functionRef:
      name: function-auto-ready
